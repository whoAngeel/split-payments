info:
  name: SET COMMISSION
  type: http
  seq: 5

http:
  method: PUT
  url: "{{gallery_host}}/api/galleries/{{gallery_id}}/commission"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "rate": 2500
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
