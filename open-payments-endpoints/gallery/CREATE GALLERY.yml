info:
  name: CREATE GALLERY
  type: http
  seq: 3

http:
  method: POST
  url: "{{gallery_host}}/api/galleries"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "name": "My Gallery"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
