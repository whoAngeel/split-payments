info:
  name: CREATE PRODUCT
  type: http
  seq: 9

http:
  method: POST
  url: "{{gallery_host}}/api/artisans/{{artisan_id}}/products"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "name": "New Product",
        "base_price": 7500,
        "asset_code": "USD",
        "asset_scale": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
