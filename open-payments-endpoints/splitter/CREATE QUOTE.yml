info:
  name: CREATE QUOTE
  type: http
  seq: 2

http:
  method: POST
  url: "{{split_host}}/quote"
  body:
    type: json
    data: |-
      {
        "sender_wallet": "https://ilp.interledger-test.dev/angeel",
        "incoming_payment_id": "{{incoming_payment_id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('quote_id', res.body.id);
        bru.setVar('total_debit_amount', res.body.debitAmount.value);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
