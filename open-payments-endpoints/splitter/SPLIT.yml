info:
  name: SPLIT
  type: http
  seq: 3

http:
  method: POST
  url: "{{split_host}}/split"
  body:
    type: json
    data: |-
      {
        "sender_wallet": "https://ilp.interledger-test.dev/angeel",
        "shares": [
          { "wallet": "https://ilp.interledger-test.dev/angeel", "amount": "300" },
          { "wallet": "https://ilp.interledger-test.dev/angeel", "amount": "200" }
        ]
      }
  auth: inherit

script:
  res: |-
    bru.setVar('session_id', res.body.session_id);
    bru.setVar('redirect_url', res.body.redirect_url);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
