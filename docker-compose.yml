services:
  postgres:
    image: postgres:17
    container_name: openpayments-postgres
    environment:
      POSTGRES_USER: openpayments
      POSTGRES_PASSWORD: openpayments
      POSTGRES_DB: openpayments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpayments"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: openpayments-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  gallery:
    build:
      context: ./backend
      dockerfile: Dockerfile.gallery
    container_name: openpayments-gallery
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://openpayments:openpayments@postgres:5432/openpayments?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SPLITTER_URL: http://splitter:4001
      SPLITTER_API_KEY: ${SPLITTER_API_KEY:-dev-splitter-key}
      INVITE_CODE: ${INVITE_CODE:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: products
      WALLET_ADDRESS_URL: ${WALLET_ADDRESS_URL}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH}
      KEY_ID: ${KEY_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  splitter:
    build:
      context: ./backend
      dockerfile: Dockerfile.splitter
    container_name: openpayments-splitter
    ports:
      - "4001:4001"
    environment:
      WALLET_ADDRESS_URL: ${WALLET_ADDRESS_URL}
      PRIVATE_KEY_PATH: ${PRIVATE_KEY_PATH}
      KEY_ID: ${KEY_ID}
      SPLITTER_API_KEY: ${SPLITTER_API_KEY:-dev-splitter-key}
      SPLITTER_PUBLIC_URL: ${SPLITTER_PUBLIC_URL:-http://localhost:4001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      gallery:
        condition: service_started
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: openpayments-adminer
    ports:
      - "8070:8080"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
