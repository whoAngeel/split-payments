services:
  postgres:
    image: postgres:16
    container_name: openpayments-postgres
    environment:
      POSTGRES_USER: openpayments
      POSTGRES_PASSWORD: openpayments
      POSTGRES_DB: openpayments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: openpayments-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
